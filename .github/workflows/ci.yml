name: KSSMCS CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore KSSMCS.sln

      - name: Build solution
        run: dotnet build KSSMCS.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test KSSMCS.sln --no-build --configuration Release